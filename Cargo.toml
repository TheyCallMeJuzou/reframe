[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# GPUI's Windows backend with reframe's changes (see vendor/gpui-pre-windows/REFRAME.md).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
