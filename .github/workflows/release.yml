# Builds a version tag (v1.2.3, matching Cargo.toml) into a draft GitHub release. Windows: the installer, latest.yml
# (which the updaters read, also installed 0.x copies) and the portable ZIP. Linux: the AppImage, the .deb and
# latest-linux.yml (read by the AppImages' updaters, 0.x's too). Publishing the release makes the update available.
# The release notes come from docs/releases/<tag>.md (GitHub's generated notes if there is none). macOS gets no
# files: it stays on the last 0.x release for now.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed through SignPath once that is set up (the repository variable SIGNPATH_ORGANIZATION_ID, see
      # docs/RELEASING.md); until then the files go out unsigned.
      SIGN_WINDOWS: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag and Cargo.toml agree
        shell: bash
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: NSIS
        run: choco install nsis --no-progress -y
      - name: Build (installer, latest.yml, portable ZIP)
        run: powershell -File scripts/package.ps1
      - name: Draft release
        shell: bash
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "reframe ${GITHUB_REF_NAME#v}" "$@" ||
            gh release view "$GITHUB_REF_NAME" > /dev/null
      - name: Upload (unsigned)
        if: env.SIGN_WINDOWS != 'true'
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "dist/reframe-Setup-$v.exe" dist/latest.yml \
            "dist/reframe-$v-win-portable.zip" --clobber

      # Signing: one request to SignPath with the installer and the portable ZIP (.signpath/artifact-configuration.xml
      # says what in them gets signed), approved by hand there; this job waits for it up to four hours.
      - name: Collect what gets signed
        id: to-sign
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          mkdir dist/to-sign
          cp dist/reframe-Setup-*.exe dist/reframe-*-win-portable.zip dist/to-sign/
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload for signing
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-to-sign
          path: dist/to-sign/
      - name: Sign (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: reframe
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.to-sign.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: dist/signed
      # Checks the signatures, puts the signed files in place and writes latest.yml anew (the signed installer has
      # another checksum), then uploads them.
      - name: Upload (signed)
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          powershell -File scripts/signed.ps1 dist/signed
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "dist/reframe-Setup-$v.exe" dist/latest.yml \
            "dist/reframe-$v-win-portable.zip" --clobber

  linux:
    # The oldest Ubuntu reframe is built on: the AppImage and the package run where its glibc (2.35) or a newer one is.
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag and Cargo.toml agree
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - name: Packages (what GPUI builds with)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build (AppImage, .deb, latest-linux.yml)
        run: scripts/package-linux.sh
      - name: Draft release
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "reframe ${GITHUB_REF_NAME#v}" "$@" ||
            gh release view "$GITHUB_REF_NAME" > /dev/null
      - name: Upload
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "dist/reframe-$v-x86_64.AppImage" "dist/reframe_${v}_amd64.deb" \
            dist/latest-linux.yml --clobber
