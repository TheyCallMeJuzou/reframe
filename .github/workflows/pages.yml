# Publishes the website (site/) on GitHub Pages: on changes to it on main, and when a release is published, so the
# download buttons point at the new version's files (scripts/site.mjs asks GitHub for the latest release).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/logo/**'
      - 'docs/screenshots/**'
      - 'scripts/site.mjs'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling one that is under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on its tag, and the github-pages environment only deploys from main: start this workflow
  # again on main.
  on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Build the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/site.mjs _site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
