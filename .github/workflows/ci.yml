# Checks every push and pull request on Windows, where reframe 1.0 runs (macOS and Linux stay on 0.10.x for
# now): formatting, clippy, the unit tests, the end-to-end tests (the app with a fake claude, driven over its
# test channel and UI Automation), and the installer, tried out under names of its own.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The fake claude the end-to-end tests run is a Node script.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: NSIS (for the installer)
        run: choco install nsis --no-progress -y
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit and end to end)
        run: cargo test --workspace
      - name: Installer, tried out
        run: powershell -File scripts/test-installer.ps1
